plugins {
    id 'com.android.application'
}

android {
    namespace 'com.geometryjumping.gdps'
    compileSdk 35

    defaultConfig {
        applicationId 'com.geometryjumping.gdps'
        minSdk 23
        targetSdk 28

        versionCode 1
        versionName '1.0'

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
        }
    }
}
